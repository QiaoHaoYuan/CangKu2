<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7fb" />
<title>课表 · 谁用谁自己填</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#121a2b; --ink2:#6b7690; --line:#e4e8f2;
    --accent:#4F6BFF; --today:#eef2ff; --shadow:0 10px 30px -18px rgba(20,30,60,.45);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1220; --card:#151c2e; --ink:#eef2ff; --ink2:#94a0bd; --line:#26304a;
           --accent:#7d95ff; --today:#1b2440; --shadow:0 10px 30px -18px rgba(0,0,0,.8); }
    meta[name=theme-color]{content:#0d1220}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(14px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  }
  header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .titles{flex:1;min-width:0}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .icon-btn{
    width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .icon-btn:active{transform:scale(.94)}
  main{padding:0 12px}
  .empty{
    margin:18px 12px;padding:22px 18px;border:1px dashed var(--line);border-radius:var(--radius);
    text-align:center;color:var(--ink2);font-size:14px;line-height:1.6;
  }
  .empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:6px}
  .grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
  .grid{display:grid;min-width:100%;position:relative}
  .head-cell{
    font-size:12px;color:var(--ink2);text-align:center;padding:9px 2px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card);z-index:3;
  }
  .head-cell b{display:block;font-size:13px;color:var(--ink);font-weight:600}
  .head-cell.today{background:var(--today)}
  .head-cell.today b{color:var(--accent)}
  .time-cell{
    font-size:10.5px;color:var(--ink2);text-align:center;border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);padding:4px 0;line-height:1.25;background:var(--card);z-index:2;
  }
  .time-cell b{display:block;font-size:11px;color:var(--ink);font-weight:600}
  .cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer;z-index:1}
  .cell:active{background:var(--today)}
  .today-col{background:color-mix(in srgb, var(--today) 70%, transparent)}
  .course{
    margin:2px;border-radius:9px;padding:4px 6px;overflow:hidden;cursor:pointer;
    font-size:11px;line-height:1.2;z-index:2;position:relative;
    display:flex;flex-direction:column;gap:1px;align-items:flex-start;
    background:color-mix(in srgb, var(--c) 16%, var(--card));
    border-left:3px solid var(--c);
  }
  .course .cname{font-weight:650;color:var(--ink);max-height:2.4em;overflow:hidden;word-break:break-word;width:100%}
  .course .croom{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .course.short .croom{display:none}
  .course.short .cname{max-height:2.4em}
  .course:active{filter:brightness(.96)}
  /* sheet */
  .backdrop{
    position:fixed;inset:0;background:rgba(10,16,30,.42);opacity:0;pointer-events:none;
    transition:opacity .18s ease;z-index:20;
  }
  .backdrop.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
    border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.on{transform:translateY(0)}
  .handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
  .sheet h2{font-size:16px;margin:0 0 14px}
  label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 5px}
  input,select{
    width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .colors{display:flex;gap:10px;margin-top:8px}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatch.sel{border-color:var(--ink)}
  .sheet-actions{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:#e5484d;border-color:#e5484d}
  .btn[disabled]{opacity:.45}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;
    background:rgba(20,26,40,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;
    transition:.2s;z-index:30;pointer-events:none;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{text-align:center;color:var(--ink2);font-size:11.5px;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1>课表</h1>
    <div class="sub" id="sub">点下面的空格，添加第一门课</div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
  <button class="icon-btn" id="addBtn" aria-label="添加课程">＋</button>
</header>

<main>
  <div class="empty" id="empty">
    <b>还没有课</b>
    点下面的空格添加第一门课，<br/>数据只存在这台设备上。
  </div>
  <div class="grid-wrap" id="wrap" style="display:none">
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>课表保存在本机浏览器 · 换设备不同步</footer>

<div class="backdrop" id="backdrop"></div>

<!-- 课程编辑 -->
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2 id="sheetTitle">新的课程</h2>
  <label>课程名</label>
  <input id="fName" placeholder="高等数学" autocomplete="off" />
  <div class="row">
    <div><label>教室</label><input id="fRoom" placeholder="教三 201" autocomplete="off" /></div>
    <div><label>老师</label><input id="fTeacher" placeholder="选填" autocomplete="off" /></div>
  </div>
  <label>备注</label>
  <input id="fNote" placeholder="7-12 周" autocomplete="off" />
  <div class="row">
    <div><label>星期</label><select id="fDay"></select></div>
    <div><label>开始第几节</label><input id="fStart" type="number" min="1" max="20" /></div>
    <div><label>连上几节</label><input id="fLen" type="number" min="1" max="8" /></div>
  </div>
  <label>颜色</label>
  <div class="colors" id="fColors"></div>
  <div class="sheet-actions">
    <button class="btn" id="cancelBtn">取消</button>
    <button class="btn danger" id="delBtn" style="display:none">删除</button>
    <button class="btn primary" id="saveBtn" disabled>保存</button>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="settingsSheet">
  <div class="handle"></div>
  <h2>设置</h2>
  <label>每天节数</label>
  <select id="sPeriods">
    <option value="8">8 节</option><option value="10">10 节</option><option value="12">12 节</option>
  </select>
  <label>周末</label>
  <select id="sWeekend">
    <option value="0">只显示周一到周五</option>
    <option value="1">显示周六周日</option>
  </select>
  <div class="sheet-actions">
    <button class="btn" id="exportBtn">导出备份</button>
    <button class="btn primary" id="closeSettings">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'timetable.web.v1';
  const COLORS = ['#4F6BFF','#FF6B4A','#F59E0B','#10B981','#8B5CF6','#0EA5B7'];
  const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
  const TIMES = [['8:00','8:45'],['8:50','9:35'],['9:50','10:35'],['10:45','11:30'],['11:35','12:20'],
                 ['14:00','14:45'],['14:50','15:35'],['15:55','16:40'],['16:45','17:30'],
                 ['18:30','19:15'],['19:20','20:05'],['20:10','20:55']];

  const $ = (id) => document.getElementById(id);
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let state = load();
  let editing = null;      // 正在编辑的课程副本
  let editingId = null;    // null = 新增

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && Array.isArray(raw.courses)) {
        return {
          courses: raw.courses.filter(c => c && c.id && c.name).map(c => ({
            id: String(c.id), name: String(c.name),
            room: String(c.room || ''), teacher: String(c.teacher || ''),
            note: String(c.note || ''),
            day: clamp(Number(c.day) || 1, 1, 7),
            start: clamp(Number(c.start) || 1, 1, 20),
            len: clamp(Number(c.len) || 1, 1, 8),
            color: COLORS.includes(c.color) ? c.color : COLORS[0],
          })),
          settings: {
            weekend: Boolean(raw.settings && raw.settings.weekend),
            periods: [8,10,12].includes(raw.settings && raw.settings.periods) ? raw.settings.periods : 12,
          },
        };
      }
    } catch (e) {}
    return { courses: [], settings: { weekend: false, periods: 12 } };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('保存失败：浏览器存储不可用'); }
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('on'), 1600);
  }

  const todayIdx = () => (new Date().getDay() + 6) % 7 + 1; // 周一=1

  function render() {
    const { courses, settings } = state;
    const dayCount = settings.weekend ? 7 : 5;
    const periods = Math.max(settings.periods, ...courses.map(c => c.start + c.len - 1));
    const grid = $('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `46px repeat(${dayCount}, minmax(58px, 1fr))`;
    grid.style.gridTemplateRows = `38px repeat(${periods}, 54px)`;

    // 表头
    const corner = document.createElement('div');
    corner.className = 'head-cell';
    corner.style.gridArea = '1 / 1';
    corner.textContent = '节';
    grid.appendChild(corner);

    const monday = mondayOf(new Date());
    for (let d = 1; d <= dayCount; d++) {
      const cell = document.createElement('div');
      cell.className = 'head-cell' + (d === todayIdx() ? ' today' : '');
      cell.style.gridArea = `1 / ${d + 1}`;
      const date = addDays(monday, d - 1);
      cell.innerHTML = `<b>${DAYS[d - 1]}</b>${date.getMonth() + 1}/${date.getDate()}`;
      grid.appendChild(cell);
    }

    // 时间列 + 空格
    for (let p = 1; p <= periods; p++) {
      const t = document.createElement('div');
      t.className = 'time-cell';
      t.style.gridArea = `${p + 1} / 1`;
      t.innerHTML = `<b>${p}</b>${TIMES[p - 1] ? TIMES[p - 1][0] : ''}`;
      grid.appendChild(t);

      for (let d = 1; d <= dayCount; d++) {
        if (courseAt(courses, d, p)) continue;
        const c = document.createElement('div');
        c.className = 'cell' + (d === todayIdx() ? ' today-col' : '');
        c.style.gridArea = `${p + 1} / ${d + 1}`;
        c.addEventListener('click', () => openAdd(d, p));
        grid.appendChild(c);
      }
    }

    // 课程块
    for (const c of courses) {
      if (c.day > dayCount) continue;
      const el = document.createElement('div');
      el.className = 'course';
      el.style.setProperty('--c', c.color);
      el.style.gridArea = `${c.start + 1} / ${c.day + 1} / span ${c.len} / span 1`;
      if (c.len === 1) el.classList.add('short');
      el.innerHTML = `<div class="cname">${esc(c.name)}</div>${c.room ? `<div class="croom">${esc(c.room)}</div>` : ''}`;
      el.addEventListener('click', (e) => { e.stopPropagation(); openEdit(c.id); });
      grid.appendChild(el);
    }

    const hasAny = courses.length > 0;
    $('wrap').style.display = '';
    $('empty').style.display = hasAny ? 'none' : '';
    const names = new Set(courses.map(c => c.name.trim()));
    const total = courses.filter(c => c.day <= dayCount).reduce((s, c) => s + c.len, 0);
    $('sub').textContent = hasAny ? `${names.size} 门课 · 每周 ${total} 节` : '点下面的空格，添加第一门课';
  }

  function courseAt(courses, day, period) {
    return courses.find(c => c.day === day && period >= c.start && period < c.start + c.len);
  }

  const mondayOf = (date) => { const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()); return addDays(d, -((d.getDay() + 6) % 7)); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // ---------- 编辑面板 ----------
  function fillDays(selected) {
    $('fDay').innerHTML = DAYS.map((d, i) => `<option value="${i + 1}"${i + 1 === selected ? ' selected' : ''}>${d}</option>`).join('');
  }
  function fillColors(selected) {
    $('fColors').innerHTML = COLORS.map(c => `<button class="swatch${c === selected ? ' sel' : ''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
    $('fColors').querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => fillColors(b.dataset.c)));
  }
  const selectedColor = () => { const s = $('fColors').querySelector('.swatch.sel'); return s ? s.dataset.c : COLORS[0]; };
  const nextColor = () => COLORS.find(c => !state.courses.some(x => x.color === c)) || COLORS[state.courses.length % COLORS.length];

  function openSheet(id) {
    $(id).classList.add('on');
    $('backdrop').classList.add('on');
  }
  function closeSheets() {
    $('sheet').classList.remove('on');
    $('settingsSheet').classList.remove('on');
    $('backdrop').classList.remove('on');
    editing = null; editingId = null;
  }

  function openAdd(day, start) {
    const free = freeLen(day, start);
    editing = { name: '', room: '', teacher: '', note: '', day, start, len: 1, color: nextColor() };
    editingId = null;
    $('sheetTitle').textContent = '新的课程';
    $('delBtn').style.display = 'none';
    fillForm(editing);
    openSheet('sheet');
    setTimeout(() => $('fName').focus(), 250);
    if (free > 1) editing.len = 1;
  }

  function openEdit(id) {
    const c = state.courses.find(x => x.id === id);
    if (!c) return;
    editing = { ...c };
    editingId = id;
    $('sheetTitle').textContent = '编辑课程';
    $('delBtn').style.display = '';
    fillForm(editing);
    openSheet('sheet');
  }

  function fillForm(v) {
    $('fName').value = v.name;
    $('fRoom').value = v.room;
    $('fTeacher').value = v.teacher;
    $('fNote').value = v.note;
    $('fStart').value = v.start;
    $('fLen').value = v.len;
    fillDays(v.day);
    fillColors(v.color);
    $('saveBtn').disabled = !v.name.trim();
  }

  function readForm() {
    editing.name = $('fName').value.trim();
    editing.room = $('fRoom').value.trim();
    editing.teacher = $('fTeacher').value.trim();
    editing.note = $('fNote').value.trim();
    editing.start = clamp(Number($('fStart').value) || 1, 1, 20);
    editing.len = clamp(Number($('fLen').value) || 1, 1, 8);
    editing.day = Number($('fDay').value) || 1;
    editing.color = selectedColor();
    $('saveBtn').disabled = !editing.name;
  }

  function freeLen(day, start) {
    let n = 1;
    while (n < 8 && !state.courses.some(c => c.day === day && start + n >= c.start && start + n < c.start + c.len)) n++;
    return n;
  }

  $('fName').addEventListener('input', readForm);
  ['fRoom','fTeacher','fNote','fStart','fLen'].forEach(id => $(id).addEventListener('input', readForm));
  $('fDay').addEventListener('change', readForm);

  $('saveBtn').addEventListener('click', () => {
    readForm();
    if (!editing.name) return;
    const clash = state.courses.find(c => c.id !== editingId && c.day === editing.day &&
      editing.start < c.start + c.len && c.start < editing.start + editing.len);
    if (clash) { toast(`和「${clash.name}」时间重叠`); return; }
    if (editingId) {
      state.courses = state.courses.map(c => c.id === editingId ? { ...editing, id: editingId } : c);
    } else {
      state.courses.push({ ...editing, id: uid() });
    }
    save(); render(); closeSheets(); toast(editingId ? '已保存' : '已添加');
  });

  $('delBtn').addEventListener('click', () => {
    if (!editingId) return;
    if (!confirm('删除这门课？')) return;
    state.courses = state.courses.filter(c => c.id !== editingId);
    save(); render(); closeSheets(); toast('已删除');
  });

  $('cancelBtn').addEventListener('click', closeSheets);
  $('backdrop').addEventListener('click', closeSheets);

  // ---------- 设置 ----------
  $('addBtn').addEventListener('click', () => openAdd(1, 1));
  $('settingsBtn').addEventListener('click', () => {
    $('sPeriods').value = String(state.settings.periods);
    $('sWeekend').value = state.settings.weekend ? '1' : '0';
    openSheet('settingsSheet');
  });
  $('sPeriods').addEventListener('change', () => { state.settings.periods = Number($('sPeriods').value) || 12; save(); render(); });
  $('sWeekend').addEventListener('change', () => { state.settings.weekend = $('sWeekend').value === '1'; save(); render(); });
  $('closeSettings').addEventListener('click', closeSheets);
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'timetable-backup.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('已导出');
  });

  render();
})();
</script>
</body>
</html>
